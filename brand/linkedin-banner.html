<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkedIn banner · Valter Zuliani</title>
<style>
@font-face{font-family:Inter;font-weight:400;src:url(../fonts/inter-400.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:600;src:url(../fonts/inter-600.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:800;src:url(../fonts/inter-800.woff2) format("woff2")}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#0d1326;color:#e6e9f5;font-family:Inter,system-ui,sans-serif;position:relative}
body::before{content:"";position:absolute;inset:0;background:
  radial-gradient(42% 70% at 82% 50%,rgba(99,102,241,.42),transparent 70%),
  radial-gradient(30% 60% at 8% 80%,rgba(246,196,83,.14),transparent 70%)}
body::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(60% 80% at 75% 50%,#000,transparent 75%);mask-image:radial-gradient(60% 80% at 75% 50%,#000,transparent 75%)}
/* the 4:1 band LinkedIn keeps, centred vertically */
.band{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);aspect-ratio:4/1;display:flex;align-items:center;justify-content:flex-end;padding:0 5.5%;z-index:1}
.copy{max-width:56%;text-align:left}
.line{font-weight:800;font-size:clamp(20px,3.1vw,44px);letter-spacing:-.035em;line-height:1.08;color:#fff;margin:0 0 .45em}
.line b{color:#f6c453;font-weight:800}
.stack{display:flex;flex-wrap:wrap;gap:.45em;margin:0 0 .9em;padding:0;list-style:none;font-size:clamp(10px,1.15vw,16px)}
.stack li{border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:.25em .8em;color:#d4d9ee;background:rgba(13,19,38,.55)}
.url{font-weight:600;font-size:clamp(12px,1.45vw,20px);color:#c7cbf5;letter-spacing:.01em}
.url::before{content:"";display:inline-block;width:.55em;height:.55em;border-radius:50%;background:#34d399;margin-right:.5em;vertical-align:.08em}
</style>
</head>
<body>
<div class="band">
  <div class="copy">
    <p class="line">I build software, run it on AWS, <b>and attack it</b> to keep it safe.</p>
    <ul class="stack"><li>TypeScript</li><li>Node.js</li><li>React</li><li>AWS</li><li>Kubernetes</li><li>OWASP</li></ul>
    <span class="url">valterzuliani.com</span>
  </div>
</div>
</body>
</html>
